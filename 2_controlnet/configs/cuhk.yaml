# Final training config — CUFS, CUHK student subset (88 training pairs; 100 test pairs).
# Codebook: retrained on the 88 CUHK training pairs with 1_codebook/train_codebook.py (300 + 300 epochs). Checkpoint: step 14000.
# Same recipe on every dataset: 14 000 steps, batch 8, bf16, cosine LR to step 10 000 then a constant floor, anchored objective,
# LPIPS-VGG 0.3 + IR-SE50 identity 0.2 + latent Scharr 0.05 auxiliary losses at t <= 300, EMA 0.999 (EMA weights used at inference).
# The `inference` block below is only used for the validation images written during training; the setting of the reported
# results is in 3_inference/infer.sh.
run:
  dataset: cuhk
  split: all
  seed: 0
  precision: bf16
  deterministic: false
  run_id: cuhk_v2_final
paths:
  data_root: data
  outputs_root: outputs
  hf_home: pretrained/hf_cache
  torch_home: pretrained/torch_cache
  ir_se50: pretrained/decp/model_ir_se50.pth
  landmarks: cuhk/landmarks/mtcnn5_train.json
tone:
  enabled: true
  dir: tone_stats
  stats_split: all
  method: lab_moments
  strength: 1.0
  target: photo
anchor:
  enabled: true
  prob: 0.6
  t_min: 400
  t_max: 850
model:
  sd_model_id: SG161222/Realistic_Vision_V5.1_noVAE
  vae_id: stabilityai/sd-vae-ft-mse
  controlnet_id: lllyasviel/sd-controlnet-scribble
  gradient_checkpointing: true
codebook:
  num_embeddings: 1024
  embed_dim: 256
  sha256_file: cd94fcc40890d5ba99a9bd2c62e587e6a8739d7a37652ea5a208597da13b02b3
  sha256_embedding: 711efc144fa1490947d98247cf19f0872e920357e0f21dd50d13b434ec51cb26
adapter:
  out_channels: 16
  norm_groups: 16
  l2_normalise_tokens: true
conditioning:
  paths: both
  edge_amplification: 1.5
  edge_border_fix: true
  residual_scale: 1.0
  scale_jitter:
  - 0.8
  - 1.2
  dropout_all: 0.1
  dropout_adapter: 0.1
  dropout_edges: 0.1
data:
  geometry: squash
  photo_size: 512
  sketch_size: 256
  flip: 0.5
  num_workers: 8
  pin_memory: true
prompt:
  text: a photograph of a person's face
  dropout_per_sample: 0.1
  negative: ''
  negative_style: drawing, sketch, painting, cartoon, 3d render
  negative_style_above_cfg: 1.25
  attributes:
    enabled: false
    dir: attributes
    on_missing: fixed
timesteps:
  sampler: mixed
  shuffle: true
  mse_weighting: min_snr
  gamma: 5.0
aux:
  max_t: 300
  snr_weight: true
  max_decode: 4
  loss_size: 256
  lpips_vgg: 0.3
  scharr: 0.0
  gmsd: 0.0
  latent_l1_scharr: 0.05
  id:
    net: ir_se50
    align: gt_landmarks_mtcnn
    max_t: 300
    weight: 0.2
    weights_sha256: a035c768259b98ab1ce0e646312f48b9e1e218197a0f80ac6765e88f8b6ddf28
  fsim_surrogate:
    enabled: false
    max_t: 300
    weight: 0.5
  ms_ssim:
    enabled: false
    max_t: 300
    weight: 0.5
  boost:
    start_step: 0
    lpips: 1.0
    id: 1.0
optim:
  lr_controlnet: 1.0e-05
  lr_adapter_and_new_columns: 5.0e-05
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  warmup_steps: 500
  schedule: cosine
  min_lr_ratio: 0.1
  total_steps: 14000
  schedule_steps: 10000
  batch: 8
  grad_clip: 1.0
ema:
  decay: 0.999
  include_buffers: true
  eval_with_ema: true
checkpoint:
  every_steps: 500
  keep_last: 3
  keep_every: 2000
val:
  every_steps: 2000
  split: val
  seeds:
  - 0
  write_png: true
  loss_t:
  - 200
  - 500
  - 800
  loss_train_stems: 40
  max_images: null
log:
  every_steps: 50
  tensorboard: true
inference:
  sampler: dpmpp_2m_karras
  steps: 30
  timestep_spacing: trailing
  eta: 0.0
  guidance_scale: 1.5
  control_guidance_end: 1.0
  guess_mode: false
  start: xhat
  strength: 0.4
  precision: fp16
  batch_size: 8
  output_size:
  - 200
  - 250
  use_ema: true
